[project]
name = "sphinx-orange-book-theme"
version = "0.21.0"
description = "An orange version of sphinx-book-theme."
authors = [
    { name = "Kenta Kabashima", email = "kenta_program37@hotmail.co.jp" },
]
license = "MIT"
readme = "README.md"
keywords = ["sphinx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Sphinx :: Theme",
    "Intended Audience :: Developers",
    # poetry says that the following classifier of license is deprecated,
    # but actually PyPI requires it for correct handling.
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.12,<3.15"
dependencies = ["sphinx-book-theme (>=1.4.0)", "sphinx (>=9.1.0)"]

[project.urls]
Homepage = "https://gitlab.com/MusicScience37Projects/utility-libraries/sphinx-orange-book-theme"
Documentation = "https://sphinx-orange-book-theme-musicscience37projects--1dc46f9ab80e60.gitlab.io/"
Repository = "https://gitlab.com/MusicScience37Projects/utility-libraries/sphinx-orange-book-theme.git"

[project.entry-points."sphinx.html_themes"]
sphinx_orange_book_theme = "sphinx_orange_book_theme"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.2"
black = "^26.5.1"
isort = "^9.0.2"
jinja2 = "^3.1.6"
colour-science = "^0.4.7"

[tool.poetry.group.doc.dependencies]
toml = "^0.10.2"
types-toml = "^0.10.8.20260518"
sphinx-autobuild = "^2025.8.25"
myst-parser = "^5.1.0"
doc8 = "^2.0.0"

[tool.poetry.group.test.dependencies]
breathe = "^5.0.0"
myst-nb = "^1.4.0"
jupyterlab = "^4.6.4"
ipywidgets = "^8.1.9"
ipython = "^9.17.1"
ipykernel = "^7.4.0"
plotly = "^7.1.0"
pandas = "^3.0.6"
sphinxext-opengraph = "^0.13.0"
sphinxcontrib-plantuml = "^0.31"
sphinxcontrib-bibtex = "^2.7.0"
setuptools = "^84.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
